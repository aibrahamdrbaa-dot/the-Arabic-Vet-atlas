<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجهاز الهيكلي للقطة | الأطلس البيطري العربي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ec;color:#172334;font:1rem/1.6 system-ui,sans-serif}
main{max-width:1280px;margin:auto;padding:clamp(16px,4vw,48px)}
a{color:#204fba}
h1{line-height:1.25}
.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px}
#stage,aside{background:#fff;border:1px solid #dcdfe5;border-radius:16px;padding:16px}
#stage{position:relative;display:grid;place-items:center;min-height:clamp(300px,60vh,650px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
label{display:block;margin-top:12px}
textarea,select,input:not([type=checkbox]),button{max-width:100%;font:inherit}
textarea,select{width:100%} textarea{min-height:90px}
button{cursor:pointer;margin-block:8px}
#layer-list div{display:flex;gap:8px;align-items:center}
#layer-list label{flex:1;margin:0;overflow-wrap:anywhere}
@media(max-width:760px){.workspace{grid-template-columns:1fr}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}
</script>
<main>
  <nav><a href="/#/animals/cat">العودة إلى صفحة القطة</a></nav>
  <h1>الجهاز الهيكلي للقطة</h1>
  <p>لا توجد عينة معتمدة في الكتالوج بعد. يمكنك تجربة عارض الأطلس بملف GLB من جهازك. يبقى الملف داخل المتصفح.</p>
  <div class="workspace">
    <section id="stage" aria-label="عارض ثلاثي الأبعاد"><p id="empty">اختر ملف GLB لعرضه هنا.</p></section>
    <aside aria-label="أدوات الدراسة">
      <label for="file">إضافة ملف GLB كطبقة</label>
      <input id="file" type="file" accept=".glb">
      <p id="status" role="status"></p>
      <button id="reset" type="button" disabled>إعادة ضبط العرض</button>
      <button id="isolate" type="button" aria-pressed="false" disabled>عزل الجزء المحدد</button>
      <fieldset><legend>الطبقات</legend><div id="layer-list">لا توجد طبقات محمّلة.</div></fieldset>
      <label for="part">اختيار جزء من الملف</label>
      <select id="part"><option value="">ملاحظات الجهاز الهيكلي</option></select>
      <label for="color">لون الجزء المحدد</label>
      <input id="color" type="color" value="#4176d6" disabled>
      <button id="clear-color" type="button" disabled>استعادة لون الجزء</button>
      <label for="note">ملاحظاتي</label>
      <textarea id="note" maxlength="4000" placeholder="اكتب ملاحظاتك هنا"></textarea>
      <button id="save" type="button">حفظ على هذا المتصفح</button>
      <button id="export" type="button">تصدير الملاحظات والألوان (JSON)</button>
    </aside>
  </div>
</main>
<script type="module" src="./study.js"></script>
</html>
